<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cavijs - Jack & Plug</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #eee; }
        h1 { margin-bottom: 20px; text-align: center; }
        #container { 
            position: relative; 
            width: 1000px; 
            height: 600px; 
            background: #fff; 
            border: 1px solid #ccc; 
            margin: 0 auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #wireCanvas { width: 100%; height: 100%; display: block; }
        .instructions { text-align: center; margin-bottom: 10px; color: #555; }
    </style>
  </head>
  <body>
    <h1>Jack & Plug connection demo</h1>
    <div class="instructions">Drag plugs (grey) to jacks (colored). Drop to connect. Drag away to disconnect.</div>
    <div id="container">
        <canvas id="wireCanvas" width="1000" height="600"></canvas>
    </div>
    <script type="module" src="/src/example2.ts"></script>
  </body>
</html>
