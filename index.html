<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cavijs</title>
  </head>
  <body>
    <div id="container">
        <canvas id="wireCanvas" width="800" height="600"></canvas>
        <cavi-controls id="controls"></cavi-controls>
        <div id="debugInfo">
            <h2 style="margin-top: 0; color: #4A90E2; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 8px;">📊 Debug Info</h2>
            <div class="stats">FPS: <span class="highlight" id="fps">0</span></div>
            <div class="stats">Wire Count: <span class="highlight" id="wireCount">0</span></div>
            <div class="stats">Total Data Points: <span class="highlight" id="dataPoints">0</span></div>
            <div class="stats">Memory Buffer: <span class="highlight" id="bufferSize">0</span> bytes</div>
            <div class="stats">Mouse: (<span class="highlight" id="mouseX">-</span>, <span class="highlight" id="mouseY">-</span>)</div>
            <div style="margin-top: 12px; border-top: 1px solid #444; padding-top: 12px;">
                <div style="color: #aaa; font-size: 11px; margin-bottom: 8px;">Wire Details:</div>
                <div id="wireDetails"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
